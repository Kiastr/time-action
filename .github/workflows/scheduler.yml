# ============================================================
#  万能调度器 —— 一个 workflow 跑你所有的脚本
# ============================================================
#  这个文件就是"调度中心"。你不需要为每个任务单独写 yml，
#  所有任务都通过 scripts/run.py 按 tasks.json 里的配置分发。
#
#  加新任务 = 往 scripts/ 丢个脚本 + 在 tasks.json 里加一行配置
#  改时间   = 改下面 cron（注意：只支持 UTC！北京时间 - 8）
# ============================================================

name: Scheduler

on:
  schedule:
    # 每 6 小时跑一次（UTC）。以下为常用对照：
    #   北京时间 08:00  ->  '0 0 * * *'     每天一次
    #   北京时间 09:00  ->  '0 1 * * *'
    #   每 6 小时       ->  '0 */6 * * *'
    #   每 30 分钟      ->  '*/30 * * * *'  （最小间隔是 5 分钟）
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: '只跑指定任务（留空 = 全部）。例如: demo'
        required: false
        default: ''

# 同仓库并发时取消旧的，避免重叠跑
concurrency:
  group: scheduler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # ★ 关键：防止挂机被判定为滥用，也防止脚本卡死烧额度
    timeout-minutes: 20

    # 保活提交需要写权限
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # ---------- Python 环境 ----------
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ---------- Node 环境（不需要可以整段删掉） ----------
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Node 依赖
        run: |
          if [ -f package.json ]; then npm install --no-audit --no-fund; fi

      # ---------- 跑任务 ----------
      - name: 执行任务
        env:
          # ↓↓↓ 在这里注入 Secrets，脚本里用 os.environ 读 ↓↓↓
          # 变量名必须和你在  仓库 Settings → Secrets → Actions  里建的一致
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          # ↑↑↑ 复制一行加一个，没配的会是空字符串，脚本里判空跳过 ↑↑↑
        run: python scripts/run.py --task "${{ inputs.task }}"

      # ---------- 保活：防止仓库 60 天无活动导致定时任务被停用 ----------
      - name: 保活提交
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .state
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .state/.last-run
          if [ -f .state/.last-result ]; then :; fi
          git add -f .state/.last-run .state/.last-result 2>/dev/null || git add -f .state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore(keep-alive): $(date -u +%F) [skip ci]"
            git push
          fi
